const CATN={sofa:'Sofas',armchair:'Armchairs',bed:'Beds',bedside:'Bedside tables',wardrobe:'Wardrobes',desk:'Desks',officechair:'Office chairs',diningtable:'Dining tables',diningchair:'Dining chairs',coffeetable:'Coffee & side tables',tvbench:'TV benches',sideboard:'Sideboards & storage',shelving:'Shelving',lamp:'Lamps',rug:'Rugs',nursery:'Cots & nursery'};
const WALLCATS=new Set(['bed','bedside','wardrobe','sofa','tvbench','sideboard','shelving','desk','nursery']);
const RN={Master:'Master bedroom',Office:'Bedroom 2 · Office + wardrobe',Seroja:'Bedroom 3 · Bilik Seroja',Living:'Living',Dining:'Dining',Kitchen:'Kitchen'};
const RCOL={Master:'#1f4fa3',Office:'#d6332b',Seroja:'#e0a21b',Living:'#222222',Dining:'#2f7d4f',Kitchen:'#7a5c3e'};
const RCEN={Master:[1.6,3],Office:[5,2],Seroja:[3.3,6.1],Living:[8.6,3.6],Dining:[8.3,6],Kitchen:[7.3,8.8]};

let curRoom='Living';document.querySelectorAll('#ui button').forEach(b=>{if(b.textContent in BTN2ROOM)b.addEventListener('click',()=>{if(BTN2ROOM[b.textContent])curRoom=BTN2ROOM[b.textContent]})});
const save=()=>{try{localStorage.setItem('apt3d_items_v1',JSON.stringify(ITEMS.map(({g,...r})=>r)))}catch(e){}};
function tagI(o,it){o.traverse(m=>{m.userData.it=it;m.userData.prod=it.no;if(m.isMesh){m.castShadow=m.receiveShadow=true;if(!pickables.includes(m))pickables.push(m)}})}
function untag(o){o.traverse(m=>{const k=pickables.indexOf(m);if(k>=0)pickables.splice(k,1)})}
const ASSET=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'':'https://cdn.jsdelivr.net/gh/kaberikram/apt3d@main/';
const asset=u=>!u||/^https?:/.test(u)||u.startsWith('models/')||!ASSET?u:ASSET+u;
const glbCache={};const loadGLB=url=>glbCache[url]??=new Promise((res,rej)=>loader.load(asset(url),g=>res(g.scene),undefined,rej));
async function build(it,prevDepth){
 const p=getP(it.no);
 if(!p.model){const g=PROXYG[it.no];if(g){if(it.x==null){const c=new THREE.Box3().setFromObject(g).getCenter(new THREE.Vector3());it.x=c.x;it.z=c.z;it.ry=0;it.base=[g.position.x,g.position.z,c.x,c.z]}
   if(it.base){g.position.x=it.base[0]+(it.x-it.base[2]);g.position.z=it.base[1]+(it.z-it.base[3])}S.add(g);it.g=g;tagI(g,it)}return}
 const src=await loadGLB(p.model);const o=src.clone(true);const w=new THREE.Group();w.add(o);
 let bb=new THREE.Box3().setFromObject(o);const sz=bb.getSize(new THREE.Vector3());if(Math.max(sz.x,sz.y,sz.z)>20){o.scale.setScalar(.001);bb=new THREE.Box3().setFromObject(o)}
 const c=bb.getCenter(new THREE.Vector3());o.position.set(-c.x,-bb.min.y,-c.z);w.rotation.y=it.ry||0;
 const hy=bb.max.y-bb.min.y,dz=bb.max.z-bb.min.z;
 if(prevDepth!=null&&WALLCATS.has(p.cat)){const d=(dz-prevDepth)/2;it.x+=Math.sin(it.ry||0)*d;it.z+=Math.cos(it.ry||0)*d}
 w.userData.depth=dz;w.position.set(it.x,it.y<0?Math.max(1.5,2.5-hy-0.45):(it.y||0),it.z);S.add(w);it.g=w;tagI(w,it)}
async function buildAll(){await Promise.all(ITEMS.map(it=>build(it).catch(e=>console.warn('model fail',it.no))));window.__models=true;refresh()}
// ---------- library ----------
fetch('library/library.json').then(r=>r.ok?r.json():{}).then(j=>{for(const k in j)if(!LIB[k])LIB[k]=j[k];refresh()}).catch(()=>{});

const info=document.getElementById('info'),list=document.getElementById('list');
const fmt=n=>'RM'+n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const artno=no=>no.replace(/(\d{3})(\d{3})(\d{2})/,'$1.$2.$3');
let selIt=null;
function show(no,it){const p=getP(no);if(!p)return;const m=p.meas||{};const d=p.dims||(m.width?`${m.width/10}x${(m.depth||m.length||0)/10}x${(m.height||m['max. height']||0)/10} cm`:'');
 info.innerHTML=`${p.thumb?`<img src="${p.thumb}" style="float:right;width:64px;height:64px;object-fit:contain;background:#fff;border-radius:8px">`:''}<b style="font-size:17px">${p.name}</b> <span class="tag ${p.model?'':'px'}">${p.model?'IKEA 3D model':'proxy'}</span><br>${p.type} · ${p.desc||''}<br>${d?('Size: '+d+'<br>'):''}Art. no. ${artno(p.no)}<br><span class="p">${fmt(p.price)}</span><br><a href="${p.url}" target="_blank">Open on IKEA Malaysia →</a> <span style="float:right;cursor:pointer" onclick="this.parentNode.style.display='none'">✕</span>`+
 (it?`<div class="ed"><button id="bSwap">⇄ Swap</button><button id="bL">⟲</button><button id="bR">⟳</button><button id="bDup">＋ Copy</button><button id="bDel">🗑</button></div><small>Edit mode: drag the piece to move it.</small>`:'');info.style.display='block';
 if(it){bSwap.onclick=()=>openPicker('swap',it);bL.onclick=()=>rot(it,Math.PI/12);bR.onclick=()=>rot(it,-Math.PI/12);bDel.onclick=()=>removeIt(it);bDup.onclick=()=>addItem(it.no,it.room,it.x+.3,it.z+.3,it.ry)}}
window.__show=show;
const badgeG=new THREE.Group();badgeG.visible=false;S.add(badgeG);const texCache={};
function badgeTex(n,c){return texCache[n+c]??=(()=>{const cv=document.createElement('canvas');cv.width=cv.height=128;const g=cv.getContext('2d');g.fillStyle=c;g.beginPath();g.arc(64,64,58,0,7);g.fill();g.lineWidth=8;g.strokeStyle='#f4efe4';g.stroke();g.fillStyle='#fff';g.font='bold 64px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(n,64,68);return new THREE.CanvasTexture(cv)})()}
const ORDER=Object.keys(RN);
function lines(){const byRoom={};for(const it of ITEMS){(byRoom[it.room]??={})[it.no]=(byRoom[it.room][it.no]||0)+1}return byRoom}
function refresh(){const byRoom=lines();let tot=0,n=0;const num={};
 let hh='<b style="font-size:16px">IKEA shopping list</b> <span style="float:right;cursor:pointer" onclick="this.parentNode.style.display=\'none\'">✕</span><br><button id="bCsv">⬇ Export CSV</button> <button id="bReset">↺ Reset to original</button>';
 for(const r of ORDER){if(!byRoom[r])continue;let sub=0;hh+=`<h4 style="color:${RCOL[r]}">${RN[r]}</h4>`;
  for(const no in byRoom[r]){const p=getP(no),q=byRoom[r][no];num[r+'|'+no]=++n;sub+=p.price*q;hh+=`<div onclick="__show('${no}')"><b style="color:${RCOL[r]}">${n}</b> ${q}× <b>${p.name}</b> ${p.type} <span class="tag ${p.model?'':'px'}">${p.model?'3D':'proxy'}</span><span style="float:right">${fmt(p.price*q)}</span><br><a href="${p.url}" target="_blank" onclick="event.stopPropagation()">ikea.com/my</a></div>`}
  tot+=sub;hh+=`<div style="text-align:right">Subtotal ${fmt(sub)}</div>`}
 list.innerHTML=hh+`<p class="tot">Total ${fmt(tot)}</p><small>Prices from ikea.com/my, Nov 2026. Delivery/assembly not included.</small>`;
 bCsv.onclick=exportCSV;bReset.onclick=()=>{if(confirm('Reset all furniture to the original design?')){localStorage.removeItem('apt3d_items_v1');location.reload()}};
 totB.textContent='Total '+fmt(tot);
 badgeG.clear();for(const it of ITEMS){if(!it.g)continue;const k=num[it.room+'|'+it.no];const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:badgeTex(k,RCOL[it.room]||'#222'),depthTest:false,toneMapped:false}));sp.renderOrder=999;sp.scale.set(.42,.42,1);
  const c=new THREE.Box3().setFromObject(it.g).getCenter(new THREE.Vector3());sp.position.set(c.x,2.7,c.z);badgeG.add(sp)}
 save()}
function exportCSV(){const byRoom=lines();const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';let rows=[['Room','Product','Type','Article no.','Qty','Unit RM','Line RM','URL']],tot=0;
 for(const r of ORDER){if(!byRoom[r])continue;let sub=0;for(const no in byRoom[r]){const p=getP(no),n=byRoom[r][no];sub+=p.price*n;rows.push([RN[r],p.name,p.type,artno(no),n,p.price.toFixed(2),(p.price*n).toFixed(2),p.url])}rows.push([RN[r],'SUBTOTAL','','','','',sub.toFixed(2),'']);tot+=sub}
 rows.push(['ALL','TOTAL','','','','',tot.toFixed(2),'']);const csv='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ikea_shopping_list_custom.csv';a.click();window.__csv=csv}
// ---------- edit ops ----------
function rot(it,a){it.ry=(it.ry||0)+a;if(it.g)it.g.rotation.y+=a;refresh()}
function removeIt(it){if(it.g){S.remove(it.g);untag(it.g)}ITEMS.splice(ITEMS.indexOf(it),1);info.style.display='none';selIt=null;refresh()}
async function swap(it,no){const prev=it.g?.userData.depth;if(it.g){S.remove(it.g);untag(it.g)}it.no=no;delete it.proxy;delete it.base;
 if(it.y>0&&!['shelving','lamp','nursery'].includes(getP(no).cat))it.y=0;try{await build(it,prev)}catch(e){alert('This 3D model is not included in this copy (lite zip). Use the full apt3d.zip to swap.')}refresh();show(no,it);window.__swapped=(window.__swapped||0)+1}
async function addItem(no,room,x,z,ry=0){const c=RCEN[room]||[5,5];const it={no,room,x:x??c[0],z:z??c[1],ry,y:0};ITEMS.push(it);try{await build(it)}catch(e){ITEMS.pop();alert('This 3D model is not included in this copy (lite zip). Use the full apt3d.zip.');return}refresh();selIt=it;show(no,it);return it}

const pk=document.createElement('div');pk.id='pick';document.body.appendChild(pk);
const st=document.createElement('style');st.textContent=`#pick{position:fixed;left:10px;top:96px;bottom:40px;width:360px;background:#fffaf2;border-radius:14px;box-shadow:0 2px 10px #0004;z-index:4;display:none;flex-direction:column;font-size:13px}
#pick .hd{padding:10px 12px;border-bottom:3px solid #222}#pick .hd b{font-size:16px}#pick input,#pick select{font:inherit;padding:5px 7px;border:1px solid #ccc;border-radius:8px;margin:3px 2px 0 0;box-sizing:border-box}
#pick .ls{overflow:auto;flex:1;padding:6px}#pick .c{display:flex;gap:8px;align-items:center;padding:6px;border-radius:10px;cursor:pointer;border:2px solid transparent}#pick .c:hover{background:#f1e8da}#pick .c.cur{border-color:#c8412f}
#pick img,#pick .ph{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:8px;flex:none}#pick .ph{display:flex;align-items:center;justify-content:center;color:#aaa;font-size:22px}
#pick .pr{color:#c8412f;font-weight:800}#pick .x{float:right;cursor:pointer;font-size:18px}.ed button{margin:6px 4px 0 0;border:0;border-radius:12px;padding:6px 10px;background:#222;color:#fff;font-weight:700;cursor:pointer}
#totB{background:#222!important;color:#fff!important}#ui button.on{outline:3px solid #c8412f}
@media (max-width:600px){#pick{width:auto;right:10px;top:auto;height:55vh}}`;document.head.appendChild(st);
let pMode=null,pIt=null;
function openPicker(mode,it){pMode=mode;pIt=it;const cat=it?getP(it.no).cat:'sofa';
 pk.innerHTML=`<div class="hd"><span class="x" id="pX">✕</span><b>${mode=='swap'?'Swap: '+getP(it.no).name+' '+getP(it.no).type:'Add item to '+RN[curRoom]}</b><br>
 <select id="pCat">${Object.entries(CATN).map(([k,v])=>`<option value="${k}" ${k==cat?'selected':''}>${v}</option>`).join('')}</select>
 ${mode=='add'?`<select id="pRoom">${Object.keys(RN).map(r=>`<option ${r==curRoom?'selected':''} value="${r}">${RN[r]}</option>`).join('')}</select>`:''}
 <input id="pQ" placeholder="Search name / type / colour" style="width:100%"><input id="pMin" type="number" placeholder="Min RM" style="width:30%"><input id="pMax" type="number" placeholder="Max RM" style="width:30%">
 <select id="pSort"><option value="s">Style first</option><option value="lo">Price ↑</option><option value="hi">Price ↓</option></select><div id="pN" style="color:#777;margin-top:3px"></div></div><div class="ls" id="pL"></div>`;
 pk.style.display='flex';pX.onclick=()=>pk.style.display='none';for(const e of [pCat,pQ,pMin,pMax,pSort])e.oninput=renderPick;renderPick()}
function renderPick(){const cat=pCat.value,q=pQ.value.toLowerCase(),mn=+pMin.value||0,mx=+pMax.value||1e9;
 let L=Object.values(LIB).filter(p=>p.cat==cat&&p.model&&p.price>=mn&&p.price<=mx&&(!q||(p.name+' '+p.type+' '+(p.design||'')+' '+(p.desc||'')).toLowerCase().includes(q)));
 if(pSort.value=='lo')L.sort((a,b)=>a.price-b.price);if(pSort.value=='hi')L.sort((a,b)=>b.price-a.price);
 pN.textContent=L.length+' with IKEA 3D models';const cur=pIt?.no;
 pL.innerHTML=L.map(p=>`<div class="c ${p.no==cur?'cur':''}" data-no="${p.no}">${p.thumb?`<img loading="lazy" src="${p.thumb}">`:'<div class="ph">▦</div>'}<div><b>${p.name}</b><br>${p.type}${p.design?' · '+p.design:''}<br><span class="pr">${fmt(p.price)}</span> <a href="${p.url}" target="_blank" onclick="event.stopPropagation()">IKEA ↗</a></div></div>`).join('');
 pL.querySelectorAll('.c').forEach(d=>d.onclick=async()=>{const no=d.dataset.no;if(pMode=='swap')await swap(pIt,no);else{const r=document.getElementById('pRoom')?.value||curRoom;curRoom=r;pIt=await addItem(no,r)}renderPick()})}
window.__openPicker=openPicker;window.__LIBALL=()=>LIB;window.__ITEMS=ITEMS;window.__swap=swap;window.__addItem=addItem;
// ---------- toolbar ----------
const lb=document.createElement('button');lb.textContent='🛒 Shopping list';lb.className='k';lb.onclick=()=>{list.style.display=list.style.display=='block'?'none':'block'};ui.appendChild(lb);
let edit=false;const eb=document.createElement('button');eb.textContent='✎ Swap / edit';eb.onclick=()=>{edit=!edit;eb.classList.toggle('on',edit);document.getElementById('t').textContent=edit?'EDIT MODE · tap a piece to swap, rotate or delete · drag to move':'Drag to orbit · pinch/scroll to zoom · tap furniture for IKEA product'};ui.appendChild(eb);

// ---------- picking + dragging ----------
const rc=new THREE.Raycaster(),mv=new THREE.Vector2(),floorPl=new THREE.Plane(new THREE.Vector3(0,1,0),0);let down,drag=null;
const ray=e=>{mv.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);rc.setFromCamera(mv,C)};
R.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];if(!edit)return;ray(e);const h=rc.intersectObjects(pickables,false)[0];
 if(h&&h.object.userData.it&&h.object.userData.it===selIt){const p=new THREE.Vector3();rc.ray.intersectPlane(floorPl,p);drag={it:selIt,ox:selIt.x-p.x,oz:selIt.z-p.z};O.enabled=false}});
R.domElement.addEventListener('pointermove',e=>{if(!drag)return;ray(e);const p=new THREE.Vector3();if(!rc.ray.intersectPlane(floorPl,p))return;const it=drag.it;const nx=p.x+drag.ox,nz=p.z+drag.oz;
 it.g.position.x+=nx-it.x;it.g.position.z+=nz-it.z;it.x=nx;it.z=nz;drag.moved=true});
R.domElement.addEventListener('pointerup',e=>{O.enabled=true;if(drag){const m=drag.moved;drag=null;if(m){refresh();return}}
 if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;ray(e);
 const hit=rc.intersectObjects(pickables,false)[0];if(hit){const it=hit.object.userData.it;if(edit&&it){selIt=it;curRoom=it.room;show(it.no,it);if(pk.style.display=='flex'&&pMode=='swap')openPicker('swap',it)}else show(hit.object.userData.prod)}else{info.style.display='none';selIt=null}});
buildAll();refresh();

if(location.hash=='#list')list.style.display='block';
